name: Mermaid Preview
identifier: com.popclip.extension.mermaid-preview
description: Render selected Mermaid diagram syntax client-side via mermaid.js. Shows a floating preview with an Edit button that opens a live split-pane editor with Copy & Close.
icon: square filled M
requirements: [text]
regex: '(?s).*(```mermaid|graph\s|flowchart\s|sequenceDiagram[\s\n]|classDiagram[\s\n]|stateDiagram|erDiagram|gantt[\s\n]|pie[\s\n]|gitGraph|mindmap[\s\n]|timeline[\s\n]|xychart-beta[\s\n]|quadrantChart[\s\n]).*'
actions:
  - title: Mermaid Preview
    icon: square filled M
    interpreter: /bin/zsh
    stoppable: true
    shellScriptFile: mermaid_preview.zsh
